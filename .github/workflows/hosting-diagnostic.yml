name: Temporary hosting deployment verification
on:
  push:
    branches:
      - arena/5bbde9a9-hishapp
permissions:
  contents: read
jobs:
  verify-hosting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy the main application with the pinned Firebase CLI
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: hishapp1
          firebaseToolsVersion: 15.33.0
