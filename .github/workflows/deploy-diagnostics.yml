name: Verify Firebase rules deployment access

on:
  push:
    branches:
      - arena/908dbb77-hishapp

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Validate workflow syntax
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/actionlint"
          gh release download v1.7.12 --repo rhysd/actionlint --pattern 'actionlint_1.7.12_linux_amd64.tar.gz' --pattern 'actionlint_1.7.12_checksums.txt' --dir "$RUNNER_TEMP/actionlint"
          cd "$RUNNER_TEMP/actionlint"
          grep 'actionlint_1.7.12_linux_amd64.tar.gz' actionlint_1.7.12_checksums.txt | sha256sum -c -
          tar -xzf actionlint_1.7.12_linux_amd64.tar.gz actionlint
          ./actionlint "$GITHUB_WORKSPACE"/.github/workflows/*.yml
      - name: Verify the Admin SDK can read the existing Firestore release
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: npm run deploy:firestore-rules -- --project hishapp1 --check-access
      - name: Compile the committed rules without publishing them
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          python3 -m pip install --quiet 'google-auth[requests]'
          python3 - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path
          from google.auth.transport.requests import Request
          from google.oauth2.service_account import Credentials

          credentials = Credentials.from_service_account_info(
              json.loads(os.environ['FIREBASE_SERVICE_ACCOUNT_JSON']),
              scopes=['https://www.googleapis.com/auth/cloud-platform'],
          )
          credentials.refresh(Request())
          source = Path('firestore.rules').read_text()
          request = urllib.request.Request(
              'https://firebaserules.googleapis.com/v1/projects/hishapp1:test',
              data=json.dumps({'source': {'files': [{'name': 'firestore.rules', 'content': source}]}}).encode(),
              headers={
                  'Authorization': f'Bearer {credentials.token}',
                  'Content-Type': 'application/json',
              },
          )
          with urllib.request.urlopen(request) as response:
              result = json.load(response)
          errors = [issue for issue in result.get('issues', []) if issue.get('severity') == 'ERROR']
          if errors:
              for issue in errors:
                  print('::error title=Firestore compilation error::' + issue.get('description', 'Unknown error'))
              raise SystemExit(1)
          print('::notice title=Firestore Rules API verified::Committed rules compile successfully; no release was changed.')
          PY
