name: Verify Firebase rules deployment access

on:
  push:
    branches:
      - arena/908dbb77-hishapp

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Validate workflow syntax
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/actionlint"
          gh release download v1.7.12 --repo rhysd/actionlint --pattern 'actionlint_1.7.12_linux_amd64.tar.gz' --pattern 'actionlint_1.7.12_checksums.txt' --dir "$RUNNER_TEMP/actionlint"
          cd "$RUNNER_TEMP/actionlint"
          grep 'actionlint_1.7.12_linux_amd64.tar.gz' actionlint_1.7.12_checksums.txt | sha256sum -c -
          tar -xzf actionlint_1.7.12_linux_amd64.tar.gz actionlint
          ./actionlint "$GITHUB_WORKSPACE"/.github/workflows/*.yml
      - name: Verify the Admin SDK can read the existing Firestore release
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: npm run deploy:firestore-rules -- --project hishapp1 --check-access
      - name: Compile the committed rules without publishing them
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          node --input-type=module <<'JS'
          import { readFile } from 'node:fs/promises';
          import { cert, deleteApp, initializeApp } from 'firebase-admin/app';
          import { getSecurityRules } from 'firebase-admin/security-rules';

          const account = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT_JSON);
          const app = initializeApp({ credential: cert(account), projectId: 'hishapp1' });
          try {
            const file = { name: 'firestore.rules', content: await readFile('firestore.rules', 'utf8') };
            const staged = await getSecurityRules(app).createRuleset(file);
            console.log(`::notice title=Firebase Rules SDK verified::Committed rules compiled into draft ${staged.name}; the active release was not changed.`);
          } catch (error) {
            const message = error.message.replaceAll('%', '%25').replaceAll('\r', '%0D').replaceAll('\n', '%0A');
            console.log(`::error title=Firebase Rules SDK verification failed::${message}`);
            process.exitCode = 1;
          } finally {
            await deleteApp(app);
          }
          JS
